name: Resolve DEV RY Stale Order

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: poma-order-ops-dev
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve DEV RY stale order
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      DEPLOY_ENVIRONMENT: dev
      REMOTE_RESOLVER: /tmp/resolve_unresolved_order.py
      REMOTE_RESOLVE_HELPER: /tmp/run_order_ops_resolve_remote.sh
      REMOTE_INSPECTOR: /tmp/inspect_unresolved_orders.py
      REMOTE_INSPECT_HELPER: /tmp/run_order_ops_inspect_remote.sh
      ORDER_REF: poma:rebalance-20260828T153836Z:0:RY:SELL
      PERM_ID: '1439585329'
      EXPECTED_CURRENT_QUANTITY: '0'
      CONFIRMATION: RESOLVE FILLED

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve generated deployment config
        run: |
          set -euo pipefail
          source ops/scripts/resolve_gcp_deploy_env.sh
          echo "Resolved ${DEPLOY_ENVIRONMENT}: project=${GCP_PROJECT_ID}, zone=${GCP_ZONE}, vm=${GCP_VM_NAME}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure gcloud project
        run: |
          set -euo pipefail
          timeout --kill-after=30s 2m gcloud config set project "${GCP_PROJECT_ID}"

      - name: Upload guarded resolver and verifier
        run: |
          set -euo pipefail
          for file in \
            ops/scripts/resolve_unresolved_order.py \
            ops/scripts/run_order_ops_resolve_remote.sh \
            ops/scripts/inspect_unresolved_orders.py \
            ops/scripts/run_order_ops_inspect_remote.sh; do
            remote="/tmp/$(basename "${file}")"
            timeout --kill-after=30s 3m gcloud compute scp \
              "${file}" \
              "${GCP_VM_NAME}:${remote}" \
              --zone "${GCP_ZONE}" \
              --tunnel-through-iap \
              --ssh-key-expire-after=15m \
              --quiet
          done

      - name: Resolve stale RY order
        run: |
          set -euo pipefail
          ssh_common=(--zone "${GCP_ZONE}" --tunnel-through-iap --ssh-key-expire-after=15m --quiet)
          printf -v remote_command 'sudo -u poma bash %q %q %q %q %q %q %q %q' \
            "${REMOTE_RESOLVE_HELPER}" \
            "${REMOTE_RESOLVER}" \
            "${ORDER_REF}" \
            "${PERM_ID}" \
            "${EXPECTED_CURRENT_QUANTITY}" \
            "${CONFIRMATION}" \
            "${GITHUB_ACTOR}" \
            "${GITHUB_RUN_ID}"
          timeout --kill-after=30s 10m gcloud compute ssh "${GCP_VM_NAME}" "${ssh_common[@]}" \
            --command "${remote_command}"

      - name: Verify unresolved count
        run: |
          set -euo pipefail
          ssh_common=(--zone "${GCP_ZONE}" --tunnel-through-iap --ssh-key-expire-after=15m --quiet)
          printf -v remote_command 'sudo -u poma bash %q %q' "${REMOTE_INSPECT_HELPER}" "${REMOTE_INSPECTOR}"
          output="$(timeout --kill-after=30s 10m gcloud compute ssh "${GCP_VM_NAME}" "${ssh_common[@]}" --command "${remote_command}")"
          printf '%s\n' "${output}"
          grep -q '^unresolved_count=0$' <<<"${output}" || {
            echo 'Resolution did not leave unresolved_count=0' >&2
            exit 1
          }

      - name: Write workflow summary
        if: ${{ always() }}
        run: |
          {
            echo '## Resolve DEV RY Stale Order'
            echo
            echo '- Target: `poma:rebalance-20260828T153836Z:0:RY:SELL`'
            echo '- Expected broker permId: `1439585329`'
            echo '- Expected current RY quantity: `0`'
            echo '- No broker order is submitted, cancelled, or replaced.'
            echo '- Rebalance session state is not cleared and monitor is not run.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify Telegram
        if: ${{ always() }}
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: >-
            POMA[dev] resolve DEV RY stale order ${{ job.status }} —
            guarded local-ledger repair only; no broker orders submitted.
