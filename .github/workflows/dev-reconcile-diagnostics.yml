name: DEV Reconcile Diagnostics
on:
  pull_request:
    paths:
      - ".github/workflows/dev-reconcile-diagnostics.yml"
      - "ops/scripts/diagnose_reconcile_cron.py"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnostics:
    name: Read-only DEV reconcile failure diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev
    env:
      DEPLOY_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v5
      - name: Resolve DEV config
        run: |
          set -euo pipefail
          source ops/scripts/resolve_gcp_deploy_env.sh
      - name: Authenticate GCP
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure GCP
        run: gcloud config set project "${GCP_PROJECT_ID}"
      - name: Upload diagnostics script
        run: |
          timeout --kill-after=30s 3m gcloud compute scp \
            ops/scripts/diagnose_reconcile_cron.py \
            "${GCP_VM_NAME}:/tmp/poma-diagnose-reconcile-cron.py" \
            --zone "${GCP_ZONE}" --tunnel-through-iap --ssh-key-expire-after=15m --quiet
      - name: Inspect DEV cron logs and order counts
        run: |
          timeout --kill-after=30s 5m gcloud compute ssh "${GCP_VM_NAME}" \
            --zone "${GCP_ZONE}" --tunnel-through-iap --ssh-key-expire-after=15m --quiet \
            --command 'sudo -u poma python3 /tmp/poma-diagnose-reconcile-cron.py'
