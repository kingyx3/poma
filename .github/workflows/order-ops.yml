name: Order Ops

on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: GitHub Environment whose VM order ledger should be inspected.
        required: true
        type: choice
        options: [dev, stg, prd]
        default: dev
      action:
        description: Read-only order operation to run on the VM.
        required: true
        type: choice
        options: [inspect-unresolved]
        default: inspect-unresolved

permissions:
  contents: read
  id-token: write

concurrency:
  group: poma-order-ops-${{ inputs.deploy_environment }}
  cancel-in-progress: false

jobs:
  order-ops:
    name: Order Ops ${{ inputs.action }} (${{ inputs.deploy_environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.deploy_environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
      INPUT_ACTION: ${{ inputs.action }}
      REMOTE_INSPECTOR: /tmp/poma-inspect-unresolved-orders.py
      REMOTE_HELPER: /tmp/poma-run-order-ops-inspect.sh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve generated deployment config
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source ops/scripts/resolve_gcp_deploy_env.sh
          echo "Resolved ${DEPLOY_ENVIRONMENT}: project=${GCP_PROJECT_ID}, zone=${GCP_ZONE}, vm=${GCP_VM_NAME}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload read-only inspector
        if: ${{ inputs.action == 'inspect-unresolved' }}
        run: |
          set -euo pipefail
          timeout --kill-after=30s 2m gcloud config set project "${GCP_PROJECT_ID}"
          timeout --kill-after=30s 3m gcloud compute scp \
            ops/scripts/inspect_unresolved_orders.py \
            "${GCP_VM_NAME}:${REMOTE_INSPECTOR}" \
            --zone "${GCP_ZONE}" \
            --tunnel-through-iap \
            --ssh-key-expire-after=15m \
            --quiet
          timeout --kill-after=30s 3m gcloud compute scp \
            ops/scripts/run_order_ops_inspect_remote.sh \
            "${GCP_VM_NAME}:${REMOTE_HELPER}" \
            --zone "${GCP_ZONE}" \
            --tunnel-through-iap \
            --ssh-key-expire-after=15m \
            --quiet

      - name: Inspect unresolved orders
        if: ${{ inputs.action == 'inspect-unresolved' }}
        run: |
          set -euo pipefail
          ssh_common=(--zone "${GCP_ZONE}" --tunnel-through-iap --ssh-key-expire-after=15m --quiet)
          timeout --kill-after=30s 10m gcloud compute ssh "${GCP_VM_NAME}" "${ssh_common[@]}" \
            --command "sudo -u poma bash '${REMOTE_HELPER}' '${REMOTE_INSPECTOR}'"

      - name: Write workflow summary
        if: ${{ always() }}
        run: |
          {
            echo '## POMA Order Ops'
            echo
            echo "- Environment: \`${DEPLOY_ENVIRONMENT}\`"
            echo "- Action: \`${INPUT_ACTION}\`"
            echo '- Mode: **read-only**'
            echo '- Uses the shared POMA command lock before querying IBKR.'
            echo '- No broker orders or durable ledger records are modified by this workflow.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify Telegram (order ops result)
        if: ${{ always() }}
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: >-
            POMA[${{ inputs.deploy_environment }}] order-ops ${{ inputs.action }}
            ${{ job.status }} — read-only inspection; no order or ledger state modified.
