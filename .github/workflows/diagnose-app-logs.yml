name: Temporary DEV app-log diagnostics

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  dev-app-logs:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: projects/998548109048/locations/global/workloadIdentityPools/poma-dev-github/providers/github
          service_account: poma-dev-github-deployer@poma-dvp.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Show exact Sep 2 order window
        run: |
          set -euo pipefail
          gcloud config set project poma-dvp
          gcloud compute ssh poma-dev-free-tier \
            --zone us-west1-b \
            --tunnel-through-iap \
            --ssh-key-expire-after=15m \
            --quiet \
            --verbosity=error \
            --no-user-output-enabled \
            --command "echo '===== reconcile exact lines 233850-233910 ====='; sudo sed -n '233850,233910p' /opt/poma/logs/poma-reconcile-cron.log; echo '===== reconcile 13:41-13:49 markers ====='; sudo grep -n -E '\[2026-09-02T13:4(1|3|5|7|9):' /opt/poma/logs/poma-reconcile-cron.log | head -n 120 || true; echo '===== monitor 13:40-13:46 markers ====='; sudo grep -n -E '\[2026-09-02T13:4(0|5):' /opt/poma/logs/poma-cron.log | head -n 160 || true; echo '===== crontabs ====='; sudo crontab -l -u ubuntu 2>&1 || true; sudo crontab -l -u poma 2>&1 || true"
