name: Temporary DEV app-log diagnostics

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  dev-app-logs:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: projects/998548109048/locations/global/workloadIdentityPools/poma-dev-github/providers/github
          service_account: poma-dev-github-deployer@poma-dvp.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Target Sep 2 PANW reconcile evidence
        run: |
          set -euo pipefail
          gcloud config set project poma-dvp
          gcloud compute ssh poma-dev-free-tier \
            --zone us-west1-b \
            --tunnel-through-iap \
            --ssh-key-expire-after=15m \
            --quiet \
            --verbosity=error \
            --no-user-output-enabled \
            --command "echo '===== cron 2026-09-02 13:40-13:50 UTC ====='; sudo journalctl -u cron --since '2026-09-02 13:40:00 UTC' --until '2026-09-02 13:50:00 UTC' --no-pager 2>/dev/null | grep -E 'poma|reconcile-orders|monitor' || true; echo '===== reconcile PANW/order 227 ====='; sudo grep -n -E 'PANW|227|replace|PendingCancel|Cancelled|cancelled after 300s' /opt/poma/logs/poma-reconcile-cron.log 2>/dev/null | tail -n 300 || true; echo '===== reconcile Sep 2 lines ====='; sudo grep -n '2026-09-02' /opt/poma/logs/poma-reconcile-cron.log 2>/dev/null | tail -n 300 || true; echo '===== monitor PANW/order 227 ====='; sudo grep -n -E 'PANW|227|PendingCancel|Cancelled|cancelled after 300s' /opt/poma/logs/poma-cron.log 2>/dev/null | tail -n 120 || true; echo '===== log metadata ====='; sudo ls -lh --full-time /opt/poma/logs/poma-reconcile-cron.log /opt/poma/logs/poma-cron.log 2>/dev/null || true; sudo wc -l /opt/poma/logs/poma-reconcile-cron.log /opt/poma/logs/poma-cron.log 2>/dev/null || true"
