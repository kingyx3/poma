name: tmp-yahoo-symbol-probe
on:
  push:
    branches: [claude/project-thread-crjxoy]
    paths: [.github/workflows/tmp-yahoo-symbol-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in USMC.SW USMC.L US100.SW US100.DE USMC.MI; do
            echo "== $s"
            curl -sS -m 20 -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/$s?range=5d&interval=1d" | head -c 450 || echo "fetch failed"
            echo
          done
